<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Secure E-Voting{% endblock %} — Blind Signature System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ── Sidebar Navigation ─────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="bi bi-shield-lock-fill"></i></div>
      <div class="logo-text">
        <span class="logo-title">SecureVote</span>
        <span class="logo-sub">Blind Signature System</span>
      </div>
    </div>
  </div>

  <ul class="sidebar-nav">
    <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
      <i class="bi bi-house-fill"></i><span>Home</span>
    </a></li>
    <li><a href="/register-page" class="nav-link {% if request.path == '/register-page' %}active{% endif %}">
      <i class="bi bi-person-check-fill"></i><span>Register</span>
      <span class="nav-badge" id="nav-reg-badge"></span>
    </a></li>
    <li><a href="/vote-page" class="nav-link {% if request.path == '/vote-page' %}active{% endif %}">
      <i class="bi bi-ballot-fill"></i><span>Cast Vote</span>
      <span class="nav-badge voted-badge" id="nav-voted-badge"></span>
    </a></li>
    <li><a href="/results-page" class="nav-link {% if request.path == '/results-page' %}active{% endif %}">
      <i class="bi bi-bar-chart-fill"></i><span>Results</span>
    </a></li>
    <li><a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">
      <i class="bi bi-info-circle-fill"></i><span>About</span>
    </a></li>
  </ul>

  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      <span id="themeLabel">Light Mode</span>
    </button>
  </div>
</nav>

<!-- ── Mobile Top Bar ─────────────────────────────────────────────── -->
<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="mobileMenuBtn">
    <i class="bi bi-list"></i>
  </button>
  <span class="mobile-brand"><i class="bi bi-shield-lock-fill"></i> SecureVote</span>
  <button class="theme-toggle-mobile" id="themeToggleMobile">
    <i class="bi bi-moon-stars-fill" id="themeIconMobile"></i>
  </button>
</div>

<!-- ── Main Content ────────────────────────────────────────────────── -->
<main class="main-content" id="mainContent">
  {% block content %}{% endblock %}
</main>

<!-- ── Toast Container ────────────────────────────────────────────── -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Message here.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
